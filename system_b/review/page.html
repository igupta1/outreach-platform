<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>outreach review gate</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b7280; --bg:#fafafa; --card:#fff; --flag:#fff7ed; --flagbd:#fdba74; --best:#eef6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:#111; background:var(--bg); padding-bottom:88px; }
  header { padding:24px 20px 8px; max-width:960px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:14px; }
  main { max-width:960px; margin:0 auto; padding:12px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:14px 0; }
  .card.removed { display:none; }
  .chead { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; margin-bottom:10px; }
  /* Pushed to the far right of the card head, and quiet until hovered — it is
     destructive, so it should never be the thing the eye lands on first. */
  .chead .x { margin-left:auto; align-self:flex-start; background:none; color:var(--muted);
              font-size:20px; line-height:1; font-weight:400; padding:0 4px; border-radius:6px; }
  .chead .x:hover { background:#fee2e2; color:#b91c1c; }
  .chead .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .chead .co { font-weight:650; font-size:16px; }
  .chead .who { color:var(--muted); font-size:13px; }
  .chead .tier { font-size:11px; color:#3f6212; background:#f0fdf4; border:1px solid #bbf7d0;
                 border-radius:99px; padding:1px 8px; white-space:nowrap; }
  .sec { margin:12px 0; }
  .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .niche { font-size:14px; }
  .niche b { font-weight:650; }
  .ev { margin:4px 0 0; padding-left:0; list-style:none; font-size:13px; }
  .ev li { margin:3px 0; }
  .ev .k { display:inline-block; min-width:52px; color:var(--muted); }
  .quote { color:#374151; }
  .tscroll { overflow-x:auto; max-width:100%; }
  details > summary { cursor:pointer; color:#555; font-size:13px; user-select:none; }
  details[open] > summary { margin-bottom:6px; }
  .flags { background:var(--flag); border:1px solid var(--flagbd); border-radius:8px; padding:8px 12px; font-size:13px; }
  /* Suggestions, not stop-signs: quieter than .flags on purpose, so the
     orange box keeps meaning 'this one needs a decision'. */
  .sounds { border-left:3px solid #d4d4d8; padding:2px 0 2px 10px; font-size:13px; color:#52525b; }
  .sounds ul { margin:3px 0 0; padding-left:16px; }
  .sounds q { font-weight:600; color:#111; }
  .shared-tail { white-space:pre-wrap; color:#9ca3af; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
                 padding:8px 10px; border:1px dashed var(--line); border-radius:8px; background:#fcfcfd; }
  /* Read mode for email 1: same box as the textarea it swaps with, so clicking
     into it to edit does not make the card jump. */
  .read { white-space:pre-wrap; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
          padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:text; }
  .read:hover { border-color:#cfcfd6; }
  .claim { position:relative; border-bottom:1px dotted #1d4ed8; cursor:help; }
  .claim .pop { display:none; position:absolute; left:0; top:100%; z-index:20;
                width:340px; max-width:min(340px, 78vw);
                background:#111; color:#f4f4f5; border-radius:8px; padding:8px 10px; margin-top:2px;
                font:12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
                box-shadow:0 6px 20px rgba(0,0,0,.22); white-space:normal; cursor:default; }
  .claim:hover .pop { display:block; }
  .claim .pop .k { color:#a1a1aa; text-transform:uppercase; letter-spacing:.06em; font-size:10px; }
  .claim .pop q { color:#fff; font-weight:600; }
  .claim .pop a { color:#93c5fd; }
  .claim.unverified { border-bottom-color:#b45309; }
  button.secondary { background:#f1f1f4; color:#111; }
  button.secondary:hover { background:#e4e4e8; }
  .shared { max-width:960px; margin:0 auto; padding:0 20px; }
  .shared pre { white-space:pre-wrap; color:#6b7280; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
                background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:6px 0 0; }
  .flags ul { margin:4px 0 0; padding-left:18px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  tr.best td { background:var(--best); }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; background:#f1f1f4; font-size:11px; color:#374151; }
  a.connect { font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px;
              background:#eef4ff; color:#1d4ed8; text-decoration:none; white-space:nowrap; }
  a.connect:hover { background:#dbe6ff; text-decoration:none; }
  .card.past-cap a.connect { background:#f1f1f4; color:var(--muted); font-weight:500; }
  .card.past-cap .n::after { content:' email only'; font-size:11px; color:var(--muted); }
  .warn { color:#b45309; font-weight:600; }
  /* Pack divider. Sticks to the top while you scroll a pack's cards, so you
     always know which campaign the card in front of you belongs to — the whole
     risk of one page is pasting cfo copy into the bookkeeping campaign. */
  .packbar { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:6px 12px;
             align-items:baseline; margin:26px 0 4px; padding:10px 14px;
             background:#111; color:#fff; border-radius:10px; }
  .packbar .pk { font-weight:700; font-size:15px; letter-spacing:.02em; }
  .packbar .pmeta { color:#a1a1aa; font-size:12.5px; }
  .packbar .dl { margin-left:auto; font-size:12.5px; font-weight:600; padding:5px 12px;
                 border-radius:99px; background:#fff; color:#111; border:0; cursor:pointer; }
  .packbar .dl:hover { background:#e4e4e8; }
  .packsec { margin:0 0 30px; }
  /* The connect pick. Global across every pack — LinkedIn's cap is one budget,
     so the top N is chosen across the whole day, not per campaign. */
  a.connect.pick { background:#1d4ed8; color:#fff; }
  a.connect.pick:hover { background:#1739a8; }
  .chead .rk { font-size:11px; font-weight:700; color:#1d4ed8; background:#eef4ff;
               border-radius:99px; padding:1px 8px; white-space:nowrap; }
  .errs { max-width:960px; margin:8px auto 0; padding:0 20px; color:#b91c1c; font-size:13px; }
  a { color:#1d4ed8; text-decoration:none; } a:hover { text-decoration:underline; }
  .fields { display:grid; gap:10px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input.f, textarea.f { width:100%; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:8px 10px;
        border:1px solid var(--line); border-radius:8px; background:#fff; resize:vertical; }
  textarea.f { min-height:64px; overflow:hidden; }
  details.skips { margin-top:8px; font-size:13px; color:var(--muted); }
  details.skips td { border:none; padding:2px 10px 2px 0; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
           padding:14px 20px; display:flex; justify-content:center; gap:14px; align-items:center; }
  button { font-size:15px; font-weight:600; padding:10px 22px; border:0; border-radius:8px; background:#111; color:#fff; cursor:pointer; }
  button:hover { background:#000; }
  .foot-note { color:var(--muted); font-size:13px; }
  #removed { color:var(--muted); font-size:13px; }
  button.undo { font-size:13px; font-weight:600; padding:4px 10px; background:#f1f1f4; color:#111; }
  button.undo:hover { background:#e4e4e8; }
</style>
</head>
<body>
<header>
  <h1 id="count">—</h1>
  <div class="sub" id="meta"></div>
</header>
<div class="errs" id="errs" hidden></div>
<main id="rows"></main>
<footer>
  <span class="foot-note" id="foot-email"></span>
  <button id="download-li">Download LinkedIn CSV (all packs)</button>
  <span id="removed" hidden></span>
  <span class="foot-note" id="foot"></span>
</footer>

<script>
const DOC = __REVIEW_DATA__;
const PACKS = DOC.packs || [];
// Flat view of every prospect across every pack, each tagged with the pack it
// came from. The page groups BY pack (each goes to a different campaign) but
// ranks connect picks ACROSS packs, so both views are needed.
const ALL = [];
// TWO exports, because they have different lifetimes. The email CSV goes into
// the sequencer today and is never looked at again — the copy lives in the
// campaign after that. The LinkedIn CSV goes into the history sheet and is read
// WEEKS later, when someone finally accepts a connection request and you need
// the message that was written for them.
//
// EMAIL_COLUMNS must stay identical to run.py COLUMNS minus the LinkedIn ones,
// so the file is byte-identical to the run's own CSV, edits aside.
const EMAIL_COLUMNS = ["pack","cohort_date",
                       "email","first_name","last_name","company",
                       "subject","email_1","email_2","email_3"];
const LINKEDIN_COLUMNS = ["pack","cohort_date",
                          "email","first_name","last_name","company","linkedin_url",
                          "li_dm_1","li_dm_1_evergreen","li_dm_2"];

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid !== null && kid !== undefined) n.append(kid);
  return n;
};
const text = (t) => document.createTextNode(t == null ? "" : String(t));

function link(url, label) {
  if (!url) return text(label || "—");
  return el("a", {href:url, target:"_blank", rel:"noopener"}, text(label || url));
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + 2) + "px";
}
function autosizeAll() { document.querySelectorAll("textarea.f").forEach(autosize); }

// Email 1, read first. The claims it makes about the PROSPECT are underlined,
// and hovering one shows their own words plus the page it was found on.
//
// Read-first rather than always-editable because most cards are never edited:
// the review question is "is this safe to send", and answering it means checking
// the claims, not retyping the copy. Clicking swaps in the real textarea, which
// stays in the DOM the whole time so `buildCsv` keeps reading `.value` and knows
// nothing about any of this.
function claimSpan(c) {
  const span = el("span", {class: "claim" + (c.url ? "" : " unverified")}, text(c.text));
  const pop = el("span", {class:"pop"});
  pop.append(el("div", {class:"k"}, text(c.label)));
  if (c.quote) pop.append(el("div", {}, el("q", {}, text(c.quote))));
  if (c.how) pop.append(el("div", {class:"k"}, text(c.how)));
  if (c.url) pop.append(el("div", {}, link(c.url, "open the page ↗")));
  // A claim near either edge would push the popover off-screen, taking the
  // source link with it. Nudge it back inside on hover.
  //
  // The width is COMPUTED, not measured: the popover is display:none until
  // :hover, and a hidden element reports offsetWidth 0 — which silently made an
  // earlier version of this never move anything at all.
  span.addEventListener("mouseenter", () => {
    const vw = document.documentElement.clientWidth;
    const w = Math.min(340, vw * 0.78);
    // The FIRST fragment, not the bounding box: a claim that wraps across lines
    // has a union box starting at the paragraph's left edge, while the popover
    // is actually anchored to where the span begins.
    const box = span.getClientRects()[0] || span.getBoundingClientRect();
    const want = Math.max(8, Math.min(box.left, vw - w - 8));
    pop.style.left = (want - box.left) + "px";
  });
  span.append(pop);
  return span;
}

// Underline each claim ONCE, at its first occurrence, leftmost-first and never
// overlapping — a claim inside another claim's span would nest popovers.
//
// Once, not everywhere: the prospect's city is also the city of some gift lead
// often enough that underlining every occurrence would label a sentence about a
// different company with the prospect's evidence. The opener always comes first,
// so the first hit is the one the claim is actually about.
function highlight(body, claims) {
  const frag = document.createDocumentFragment();
  const used = new Set();
  let i = 0;
  while (i < body.length) {
    let best = null, at = -1;
    for (const c of claims) {
      if (used.has(c)) continue;
      const k = body.indexOf(c.text, i);
      if (k >= 0 && (at < 0 || k < at || (k === at && c.text.length > best.text.length))) {
        best = c; at = k;
      }
    }
    if (!best) break;
    used.add(best);
    if (at > i) frag.append(text(body.slice(i, at)));
    frag.append(claimSpan(best));
    i = at + best.text.length;
  }
  if (i < body.length) frag.append(text(body.slice(i)));
  return frag;
}

function email1Field(p) {
  const claims = p.claims || [];
  const ta = el("textarea", {class:"f", "data-key":"email_1_head"});
  ta.value = p.email_1_head !== undefined ? p.email_1_head : (p.email_1 || "");
  ta.hidden = true;
  ta.addEventListener("input", () => autosize(ta));

  const read = el("div", {class:"read", title:"click to edit"});
  const paint = () => { read.textContent = ""; read.append(highlight(ta.value, claims)); };
  paint();

  read.addEventListener("click", (ev) => {
    if (ev.target.closest("a")) return;          // let a source link through
    read.hidden = true; ta.hidden = false; autosize(ta); ta.focus();
  });
  ta.addEventListener("blur", () => { paint(); ta.hidden = true; read.hidden = false; });

  const box = el("div", {class:"field"}, el("label", {}, text("Email 1")), read, ta);
  return box;
}

function fieldsBlock(p, idx) {
  const wrap = el("div", {class:"fields"});
  const mk = (key, label, multiline) => {
    const f = multiline
      ? el("textarea", {class:"f", "data-key":key})
      : el("input", {class:"f", type:"text", "data-key":key});
    f.value = p[key] || "";
    if (multiline) { f.addEventListener("input", () => autosize(f)); }
    const box = el("div", {class:"field"}, el("label", {}, text(label)), f);
    wrap.append(box);
    return f;
  };
  // ONLY the copy that varies per prospect. Email 1's closing, email 3, and the
  // three DMs are byte-identical on every card in the run, so they are shown
  // once at the top instead of thirty times here. They still ship in the CSVs.
  mk("subject", "Subject");
  wrap.append(email1Field(p));
  // The closing, dimmed and read-only: you can see the whole email in context
  // without re-reading the same two paragraphs on every card. `buildCsv` joins
  // it back on, so the exported email_1 is unchanged.
  if (p.email_1_tail) {
    wrap.append(el("div", {class:"field"},
      el("div", {class:"shared-tail"}, text(p.email_1_tail))));
  }
  mk("email_2", "Email 2 (follow-up, blank subject)", true);
  return wrap;
}

// Only a NICHED prospect gets this block. A generalist's card said
// "generalist — no vertical claimed", which is already obvious from the copy
// itself: a generalist email opens on geography ("companies in atlanta"), and
// the reason it fell back is already a flag when there is one. Restating it on
// every generalist card was a line that never changed a decision.
function nicheLine(p) {
  if (p.classification !== "niched") return null;
  const box = el("div", {class:"niche"});
  box.append(text("niched → "), el("b", {}, text(p.niche || p.match_param || "?")));
  if (p.niche_exclusivity) box.append(text("  ·  " + p.niche_exclusivity));
  box.append(el("div", {class:"sub"}, text("how we know: " + (p.how_we_know || ""))));
  if (p.niche_phrase) box.append(el("div", {class:"sub"}, text('their words: "' + p.niche_phrase + '"')));
  return box;
}


// The advisory read (copy/naturalness.py). Deliberately NOT merged into
// `flags`: those are stop-signs a human has to clear, these are suggestions, and
// mixing them teaches you to skim the box that matters.
function soundsBlock(p) {
  if (!p.sounds_off || !p.sounds_off.length) return null;
  const ul = el("ul");
  for (const s of p.sounds_off) {
    const li = el("li", {}, el("q", {}, text(s.quote)));
    if (s.why) li.append(text("  " + s.why));
    ul.append(li);
  }
  return el("div", {class:"sounds"},
    el("span", {}, text("reads as machine-written:")), ul);
}

function flagsBlock(p) {
  if (!p.flags || !p.flags.length) return null;
  const ul = el("ul");
  for (const f of p.flags) ul.append(el("li", {}, text(f)));
  return el("div", {class:"flags"},
    el("b", {}, text("⚠ " + p.flags.length + " flag" + (p.flags.length>1?"s":"") + " to check")), ul);
}

// Evidence: company (linked to the posting), what the copy claims, and when.
// Four columns, so it fits without clipping; wrapped in a scroll container so a
// long role name scrolls rather than being cut mid-word.
function leadsTable(p) {
  if (!p.leads || !p.leads.length) return null;
  const rows = [el("tr", {},
    ...["company","claim","when","verify"].map(h => el("th",{},text(h))))];
  for (const L of p.leads) {
    const co = L.source_url
      ? link(L.source_url, L.company)          // one click to the posting
      : text(L.company);
    rows.push(el("tr", {},
      el("td", {}, co),
      el("td", {}, text(L.role || "—")),
      el("td", {}, text(L.date || "—")),
      el("td", {}, L.source_url ? link(L.source_url, "source") : text("—"))));
  }
  const t = el("table"); rows.forEach(r => t.append(r));
  return el("div", {class:"tscroll"}, t);
}

// Collapsed by default: the copy is what gets read on every card, the evidence
// is what gets opened when a flag or a line prompts a check.
function evidenceBlock(p) {
  const t = leadsTable(p);
  if (!t) return null;
  const d = el("details");
  d.append(el("summary", {}, text("evidence (" + p.leads.length + " leads)")));
  d.append(t);
  return d;
}

function card(p, idx, pi) {
  const c = el("div", {class:"card", "data-idx":idx, "data-pack":pi});
  const loc = [p.city, p.state].filter(Boolean).join(", ");
  // Drop this prospect from the run. Marked, not deleted: `buildCsv` skips a
  // removed card, so it leaves the CSV, and keeping the node is what makes
  // undo possible — a mis-click on a 100-row page would otherwise cost work
  // that cannot be recovered without regenerating.
  const x = el("button", {class:"x", type:"button", title:"remove this prospect",
                          "aria-label":"remove " + (p.company || "prospect")}, text("×"));
  x.addEventListener("click", () => { c.classList.add("removed"); refreshCounts(); });
  // The tier label makes the sort legible — without it the order looks
  // arbitrary and you cannot spot-check whether a card is where it belongs.
  const tier = p.personalization && p.personalization.label
    ? el("span", {class:"tier", title:"personalization: strongest sorts first"},
         text(p.personalization.label))
    : null;
  // Open their profile straight from the card: the connection request is sent
  // while reviewing, in the same pass, rather than from a second list later.
  const li = p.linkedin
    ? el("a", {class:"connect", href:p.linkedin, target:"_blank", rel:"noopener",
               title:"open LinkedIn to send the connection request"}, text("connect ↗"))
    : el("span", {class:"pill", title:"no LinkedIn URL in the Apollo export"},
         text("no linkedin"));
  // Filled by refreshCounts(), which is the only thing that knows the GLOBAL
  // ordering — a card cannot work out its own connect rank from inside its pack.
  const rk = el("span", {class:"rk"});
  rk.hidden = true;
  c.append(el("div", {class:"chead"},
    el("span", {class:"n"}, text("#" + (idx+1))),
    el("span", {class:"co"}, text(p.company || "(no name)")),
    rk,
    tier,
    el("span", {class:"who"}, text([p.first_name, p.email, loc].filter(Boolean).join("  ·  "))),
    li,
    x));

  const sec = (label, node) => node ? el("div", {class:"sec"}, el("div",{class:"lbl"},text(label)), node) : null;
  // Flags first (they are the only thing that stops a send), then the copy in
  // full — every prospect's copy is read, so it is never collapsed — then the
  // evidence, one click away.
  [
    flagsBlock(p) ? el("div",{class:"sec"}, flagsBlock(p)) : null,
    soundsBlock(p) ? el("div",{class:"sec"}, soundsBlock(p)) : null,
    sec("copy", fieldsBlock(p, idx)),
    sec("evidence", evidenceBlock(p)),
    sec("who they serve", nicheLine(p)),
  ].forEach(s => { if (s) c.append(s); });
  return c;
}

// Counts describe what will actually be downloaded, so they are derived from
// the live cards rather than from REVIEW — otherwise the header would keep
// promising prospects that removal has already taken out of the CSV.
// LinkedIn allows roughly 100 connection requests a week. Cards past that many
// are email-only, and marking them here means the cutoff moves when a card is
// removed — counting raw row numbers would leave the line in the wrong place the
// moment you × someone above it.
const CONNECT_CAP = 20;

function refreshCounts() {
  const live = [...document.querySelectorAll(".card:not(.removed)")];

  // The connect picks are chosen ACROSS every pack, because LinkedIn's daily
  // cap is one budget for the whole day, not one per campaign. A bookkeeping
  // prospect with named clients outranks a cfo prospect matched only on state,
  // and grouping the page by pack must not hide that.
  //
  // Recomputed on every removal: × someone in the top 20 and the 21st is
  // promoted immediately, which counting row numbers per section could never do.
  const ranked = live
    .map(c => ({c, r: rankOf(c), co: (prospectOf(c).company || "").toLowerCase()}))
    .sort((a, b) => a.r - b.r || (a.co < b.co ? -1 : a.co > b.co ? 1 : 0));
  ranked.forEach((row, i) => {
    const pick = i < CONNECT_CAP;
    row.c.classList.toggle("past-cap", !pick);
    const a = row.c.querySelector("a.connect");
    if (a) a.classList.toggle("pick", pick);
    const rk = row.c.querySelector(".rk");
    if (rk) {
      rk.hidden = !pick;
      rk.textContent = pick ? "connect #" + (i + 1) : "";
    }
  });

  const flagged = live.filter(c => c.querySelector(".flags")).length;
  const n = live.length;
  const connectable = ranked.filter(r => r.c.querySelector("a.connect")).length;
  document.getElementById("count").textContent =
    n + " prospect" + (n===1?"":"s") + " across " + PACKS.length + " pack"
    + (PACKS.length===1?"":"s") + "  ·  " + (n - flagged) + " clean  ·  " + flagged
    + " flagged  ·  connect with the top " + Math.min(connectable, CONNECT_CAP);

  // Per-pack live counts on each divider, so a pack you have emptied is obvious.
  PACKS.forEach((pk, pi) => {
    const el2 = document.getElementById("pmeta-" + pi);
    if (!el2) return;
    const c = document.querySelectorAll('.card[data-pack="' + pi + '"]:not(.removed)').length;
    el2.textContent = c + " prospect" + (c===1?"":"s") + "  ·  generated " + (pk.generated_at || "?");
  });

  const removed = document.querySelectorAll(".card.removed").length;
  const box = document.getElementById("removed");
  box.textContent = "";
  box.hidden = !removed;
  if (removed) {
    const undo = el("button", {class:"undo", type:"button"}, text("undo all"));
    undo.addEventListener("click", () => {
      document.querySelectorAll(".card.removed").forEach(c => c.classList.remove("removed"));
      refreshCounts(); autosizeAll();
    });
    box.append(text(removed + " removed  "), undo);
  }
}

function prospectOf(cardEl) {
  return PACKS[+cardEl.getAttribute("data-pack")].prospects[+cardEl.getAttribute("data-idx")];
}

function rankOf(cardEl) {
  const p = prospectOf(cardEl);
  return (p.personalization && p.personalization.rank) || 99;
}

// Most-personalized first, WITHIN each pack. This is not just a reading order:
// `buildCsv` walks the cards in DOM order, so sorting here sorts the exported
// CSV, and the strongest emails go into the campaign first.
//
// Sorted in place, before any card is built, so every index (`data-idx`, the
// "#N" label, the CSV lookup) refers to the same prospect. A row from an older
// run with no `personalization` sorts last rather than throwing.
function sortByPersonalization(prospects) {
  const rank = (p) => (p.personalization && p.personalization.rank) || 99;
  prospects.sort((a, b) => rank(a) - rank(b));
}

// Identical on every prospect IN THIS PACK, so it is shown once per pack. The
// left-field line names the pack's audience ("built this one for bookkeepers"),
// so it genuinely differs between packs and cannot be hoisted to the page.
// These are authored constants in the code — read-only here because the place
// to change them is where the reasoning for each line is written down.
function sharedBlock(pk) {
  const first = (pk.prospects || [])[0] || {};
  const shared = [
    ["email 1, closing", first.email_1_tail],
    ["email 3 (in full)", first.email_3],
  ].filter(([, v]) => v);
  if (!shared.length) return null;
  const wrap = el("div", {class:"shared"});
  const d = el("details");
  // No count in the label: removing a card would leave it stale, and the point
  // is that this copy is the same on every card, not how many there are.
  d.append(el("summary", {}, text(
    "identical on every " + pk.pack + " prospect — show")));
  for (const [label, body] of shared) {
    d.append(el("div", {class:"lbl"}, text(label)));
    d.append(el("pre", {}, text(body)));
  }
  wrap.append(d);
  return wrap;
}

function skipsBlock(pk) {
  if (!pk.skipped || !pk.skipped.length) return null;
  const d = el("details", {class:"skips"});
  d.append(el("summary", {}, text(pk.skipped.length + " prospect(s) skipped (no sequence) — show")));
  const t = el("table");
  for (const sk of pk.skipped)
    t.append(el("tr", {}, el("td",{},text(sk.firm||"?")), el("td",{},text(sk.reason||"?"))));
  d.append(t);
  return d;
}

// One divider per pack, carrying that pack's own email download. The email CSVs
// stay SEPARATE because each goes to a different campaign; only the LinkedIn
// export is combined, because it all lands in one history sheet.
function packBar(pk, pi) {
  const bar = el("div", {class:"packbar"});
  const dl = el("button", {class:"dl", type:"button"},
                text("Download " + pk.pack + " email CSV"));
  dl.addEventListener("click", () => download(pk.pack + "-emails.csv", EMAIL_COLUMNS, pi));
  bar.append(
    el("span", {class:"pk"}, text(pk.pack)),
    el("span", {class:"pmeta", id:"pmeta-" + pi}),
    dl);
  return bar;
}

function render() {
  const errs = DOC.errors || [];
  if (errs.length) {
    const box = document.getElementById("errs");
    box.hidden = false;
    box.textContent = "could not read: " + errs.join("  ·  ");
  }

  document.getElementById("meta").textContent =
    PACKS.map(pk => pk.pack + " (" + (pk.prospects||[]).length + ")").join("  ·  ");
  document.getElementById("foot-email").textContent =
    "email CSV: one per pack, in its divider above";
  document.getElementById("foot").textContent =
    "LinkedIn CSV -> your history sheet (all packs, one paste)";

  const main = document.getElementById("rows");
  PACKS.forEach((pk, pi) => {
    sortByPersonalization(pk.prospects || []);
    const sec = el("div", {class:"packsec"});
    sec.append(packBar(pk, pi));
    const sk = skipsBlock(pk);   if (sk) sec.append(sk);
    const sh = sharedBlock(pk);  if (sh) sec.append(sh);
    (pk.prospects||[]).forEach((p, i) => sec.append(card(p, i, pi)));
    main.append(sec);
    ALL.push(...(pk.prospects||[]).map(p => ({p, pack: pk.pack})));
  });
  refreshCounts();
  autosizeAll();
}

// Text wraps to more lines when the window narrows (or on zoom / font load), so
// re-fit every box to its content on those events — otherwise a box sized at
// load stays too short and clips its copy behind an internal scroll.
window.addEventListener("resize", () => requestAnimationFrame(autosizeAll));
window.addEventListener("load", autosizeAll);

function csvCell(v) {
  v = v == null ? "" : String(v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

// `packIndex === null` exports every pack (the combined LinkedIn CSV);
// otherwise just that pack's cards (one campaign's email CSV).
function buildCsv(columns, packIndex) {
  const lines = [columns.join(",")];
  const sel = packIndex === null || packIndex === undefined
    ? ".card:not(.removed)"
    : '.card[data-pack="' + packIndex + '"]:not(.removed)';
  // `:not(.removed)` is what makes the X real: a removed prospect leaves the
  // downloaded CSV entirely, which is the only place removal has to hold.
  document.querySelectorAll(sel).forEach(cardEl => {
    const pi = +cardEl.getAttribute("data-pack");
    const pk = PACKS[pi];
    const p = pk.prospects[+cardEl.getAttribute("data-idx")];
    const edited = {};
    cardEl.querySelectorAll(".f").forEach(f => { edited[f.getAttribute("data-key")] = f.value; });
    // Re-join the edited head with the dimmed closing, so the exported email is
    // the whole email exactly as run.py wrote it, carrying only your edits.
    const tail = p.email_1_tail || "";
    const head = (edited.email_1_head !== undefined ? edited.email_1_head : p.email_1_head) || "";
    const email1 = tail ? (head.replace(/\s+$/, "") + "\n\n" + tail) : head;
    const row = {
      pack: pk.pack, cohort_date: pk.generated_at,
      email: p.email, first_name: p.first_name, last_name: p.last_name,
      company: p.company, linkedin_url: p.linkedin,
      subject: edited.subject, email_1: email1,
      email_2: edited.email_2, email_3: p.email_3,
      li_dm_1: p.li_dm_1, li_dm_1_evergreen: p.li_dm_1_evergreen, li_dm_2: p.li_dm_2,
    };
    lines.push(columns.map(c => csvCell(row[c])).join(","));
  });
  return lines.join("\r\n") + "\r\n";
}

function download(name, columns, packIndex) {
  const blob = new Blob([buildCsv(columns, packIndex)], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

// ONE LinkedIn export for every pack. It all gets pasted into a single history
// sheet that is searched by name weeks later, when someone finally accepts a
// connection request — three files would mean three places to look.
document.getElementById("download-li")
  .addEventListener("click", () => download("linkedin.csv", LINKEDIN_COLUMNS, null));

render();
</script>
</body>
</html>
