<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>outreach review gate</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b7280; --bg:#fafafa; --card:#fff; --flag:#fff7ed; --flagbd:#fdba74; --best:#eef6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:#111; background:var(--bg); padding-bottom:88px; }
  header { padding:24px 20px 8px; max-width:960px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:14px; }
  main { max-width:960px; margin:0 auto; padding:12px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:14px 0; }
  .card.removed { display:none; }
  .chead { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; margin-bottom:10px; }
  /* Pushed to the far right of the card head, and quiet until hovered — it is
     destructive, so it should never be the thing the eye lands on first. */
  .chead .x { margin-left:auto; align-self:flex-start; background:none; color:var(--muted);
              font-size:20px; line-height:1; font-weight:400; padding:0 4px; border-radius:6px; }
  .chead .x:hover { background:#fee2e2; color:#b91c1c; }
  .chead .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .chead .co { font-weight:650; font-size:16px; }
  .chead .who { color:var(--muted); font-size:13px; }
  .chead .tier { font-size:11px; color:#3f6212; background:#f0fdf4; border:1px solid #bbf7d0;
                 border-radius:99px; padding:1px 8px; white-space:nowrap; }
  .sec { margin:12px 0; }
  .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .niche { font-size:14px; }
  .niche b { font-weight:650; }
  .ev { margin:4px 0 0; padding-left:0; list-style:none; font-size:13px; }
  .ev li { margin:3px 0; }
  .ev .k { display:inline-block; min-width:52px; color:var(--muted); }
  .quote { color:#374151; }
  .tscroll { overflow-x:auto; max-width:100%; }
  details > summary { cursor:pointer; color:#555; font-size:13px; user-select:none; }
  details[open] > summary { margin-bottom:6px; }
  .flags { background:var(--flag); border:1px solid var(--flagbd); border-radius:8px; padding:8px 12px; font-size:13px; }
  .flags ul { margin:4px 0 0; padding-left:18px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  tr.best td { background:var(--best); }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; background:#f1f1f4; font-size:11px; color:#374151; }
  .warn { color:#b45309; font-weight:600; }
  a { color:#1d4ed8; text-decoration:none; } a:hover { text-decoration:underline; }
  .fields { display:grid; gap:10px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input.f, textarea.f { width:100%; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:8px 10px;
        border:1px solid var(--line); border-radius:8px; background:#fff; resize:vertical; }
  textarea.f { min-height:64px; overflow:hidden; }
  details.skips { margin-top:8px; font-size:13px; color:var(--muted); }
  details.skips td { border:none; padding:2px 10px 2px 0; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
           padding:14px 20px; display:flex; justify-content:center; gap:14px; align-items:center; }
  button { font-size:15px; font-weight:600; padding:10px 22px; border:0; border-radius:8px; background:#111; color:#fff; cursor:pointer; }
  button:hover { background:#000; }
  .foot-note { color:var(--muted); font-size:13px; }
  #removed { color:var(--muted); font-size:13px; }
  button.undo { font-size:13px; font-weight:600; padding:4px 10px; background:#f1f1f4; color:#111; }
  button.undo:hover { background:#e4e4e8; }
</style>
</head>
<body>
<header>
  <h1 id="count">—</h1>
  <div class="sub" id="meta"></div>
  <details class="skips" id="skips" hidden>
    <summary></summary>
    <table id="skips-body"></table>
  </details>
</header>
<main id="rows"></main>
<footer>
  <button id="download">Download CSV</button>
  <span id="removed" hidden></span>
  <span class="foot-note" id="foot"></span>
</footer>

<script>
const REVIEW = __REVIEW_DATA__;
// Must stay identical to run.py COLUMNS — the download is meant to be
// byte-identical to the run's own CSV, edits aside.
const COLUMNS = ["pack","cohort_date",
                 "email","first_name","last_name","company","linkedin_url",
                 "subject","email_1","email_2","email_3",
                 "li_dm_1","li_dm_1_evergreen","li_dm_2"];

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid !== null && kid !== undefined) n.append(kid);
  return n;
};
const text = (t) => document.createTextNode(t == null ? "" : String(t));

function link(url, label) {
  if (!url) return text(label || "—");
  return el("a", {href:url, target:"_blank", rel:"noopener"}, text(label || url));
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + 2) + "px";
}
function autosizeAll() { document.querySelectorAll("textarea.f").forEach(autosize); }

function fieldsBlock(p, idx) {
  const wrap = el("div", {class:"fields"});
  const mk = (key, label, multiline) => {
    const f = multiline
      ? el("textarea", {class:"f", "data-key":key})
      : el("input", {class:"f", type:"text", "data-key":key});
    f.value = p[key] || "";
    if (multiline) { f.addEventListener("input", () => autosize(f)); }
    const box = el("div", {class:"field"}, el("label", {}, text(label)), f);
    wrap.append(box);
    return f;
  };
  mk("subject", "Subject");
  mk("email_1", "Email 1", true);
  mk("email_2", "Email 2 (follow-up, blank subject)", true);
  mk("email_3", "Email 3 (follow-up, blank subject)", true);
  // The LinkedIn half. Both DM #1 shapes are shown because the choice is made
  // at SEND time, not here: the fresh one names a company that "just posted",
  // which stops being true if the connection sits unaccepted for weeks.
  mk("li_dm_1", "LinkedIn DM 1 — on accept", true);
  mk("li_dm_1_evergreen", "LinkedIn DM 1 — if accepted 3+ weeks later", true);
  mk("li_dm_2", "LinkedIn DM 2 — 3 days after DM 1", true);
  return wrap;
}

// Only a NICHED prospect gets this block. A generalist's card said
// "generalist — no vertical claimed", which is already obvious from the copy
// itself: a generalist email opens on geography ("companies in atlanta"), and
// the reason it fell back is already a flag when there is one. Restating it on
// every generalist card was a line that never changed a decision.
function nicheLine(p) {
  if (p.classification !== "niched") return null;
  const box = el("div", {class:"niche"});
  box.append(text("niched → "), el("b", {}, text(p.niche || p.match_param || "?")));
  if (p.niche_exclusivity) box.append(text("  ·  " + p.niche_exclusivity));
  box.append(el("div", {class:"sub"}, text("how we know: " + (p.how_we_know || ""))));
  if (p.niche_phrase) box.append(el("div", {class:"sub"}, text('their words: "' + p.niche_phrase + '"')));
  return box;
}

function evidenceList(p) {
  if (!p.evidence || !p.evidence.length) return null;
  const ul = el("ul", {class:"ev"});
  for (const e of p.evidence) {
    ul.append(el("li", {},
      el("span", {class:"k"}, text(e.kind)),
      el("span", {class:"quote"}, text('"' + e.text + '"  ')),
      link(e.url, "source")));
  }
  return ul;
}

function flagsBlock(p) {
  if (!p.flags || !p.flags.length) return null;
  const ul = el("ul");
  for (const f of p.flags) ul.append(el("li", {}, text(f)));
  return el("div", {class:"flags"},
    el("b", {}, text("⚠ " + p.flags.length + " flag" + (p.flags.length>1?"s":"") + " to check")), ul);
}

// Evidence: company (linked to the posting), what the copy claims, and when.
// Four columns, so it fits without clipping; wrapped in a scroll container so a
// long role name scrolls rather than being cut mid-word.
function leadsTable(p) {
  if (!p.leads || !p.leads.length) return null;
  const rows = [el("tr", {},
    ...["company","claim","when","verify"].map(h => el("th",{},text(h))))];
  for (const L of p.leads) {
    const co = L.source_url
      ? link(L.source_url, L.company)          // one click to the posting
      : text(L.company);
    rows.push(el("tr", {},
      el("td", {}, co),
      el("td", {}, text(L.role || "—")),
      el("td", {}, text(L.date || "—")),
      el("td", {}, L.source_url ? link(L.source_url, "source") : text("—"))));
  }
  const t = el("table"); rows.forEach(r => t.append(r));
  return el("div", {class:"tscroll"}, t);
}

// Collapsed by default: the copy is what gets read on every card, the evidence
// is what gets opened when a flag or a line prompts a check.
function evidenceBlock(p) {
  const t = leadsTable(p);
  if (!t) return null;
  const d = el("details");
  d.append(el("summary", {}, text("evidence (" + p.leads.length + " leads)")));
  d.append(t);
  return d;
}

function card(p, idx) {
  const c = el("div", {class:"card", "data-idx":idx});
  const loc = [p.city, p.state].filter(Boolean).join(", ");
  // Drop this prospect from the run. Marked, not deleted: `buildCsv` skips a
  // removed card, so it leaves the CSV, and keeping the node is what makes
  // undo possible — a mis-click on a 100-row page would otherwise cost work
  // that cannot be recovered without regenerating.
  const x = el("button", {class:"x", type:"button", title:"remove this prospect",
                          "aria-label":"remove " + (p.company || "prospect")}, text("×"));
  x.addEventListener("click", () => { c.classList.add("removed"); refreshCounts(); });
  // The tier label makes the sort legible — without it the order looks
  // arbitrary and you cannot spot-check whether a card is where it belongs.
  const tier = p.personalization && p.personalization.label
    ? el("span", {class:"tier", title:"personalization: strongest sorts first"},
         text(p.personalization.label))
    : null;
  c.append(el("div", {class:"chead"},
    el("span", {class:"n"}, text("#" + (idx+1))),
    el("span", {class:"co"}, text(p.company || "(no name)")),
    tier,
    el("span", {class:"who"}, text([p.first_name, p.email, loc].filter(Boolean).join("  ·  "))),
    x));

  const sec = (label, node) => node ? el("div", {class:"sec"}, el("div",{class:"lbl"},text(label)), node) : null;
  // Flags first (they are the only thing that stops a send), then the copy in
  // full — every prospect's copy is read, so it is never collapsed — then the
  // evidence, one click away.
  [
    flagsBlock(p) ? el("div",{class:"sec"}, flagsBlock(p)) : null,
    sec("copy", fieldsBlock(p, idx)),
    sec("evidence", evidenceBlock(p)),
    sec("who they serve", nicheLine(p)),
    sec("niche evidence", evidenceList(p)),
  ].forEach(s => { if (s) c.append(s); });
  return c;
}

// Counts describe what will actually be downloaded, so they are derived from
// the live cards rather than from REVIEW — otherwise the header would keep
// promising prospects that removal has already taken out of the CSV.
function refreshCounts() {
  const live = [...document.querySelectorAll(".card:not(.removed)")];
  const flagged = live.filter(c => c.querySelector(".flags")).length;
  const n = live.length;
  document.getElementById("count").textContent =
    n + " prospect" + (n===1?"":"s") + "  ·  " + (n - flagged) + " clean  ·  " + flagged + " flagged";

  const removed = document.querySelectorAll(".card.removed").length;
  const box = document.getElementById("removed");
  box.textContent = "";
  box.hidden = !removed;
  if (removed) {
    const undo = el("button", {class:"undo", type:"button"}, text("undo all"));
    undo.addEventListener("click", () => {
      document.querySelectorAll(".card.removed").forEach(c => c.classList.remove("removed"));
      refreshCounts(); autosizeAll();
    });
    box.append(text(removed + " removed  "), undo);
  }
}

// Most-personalized first. This is not just a reading order: `buildCsv` walks
// the cards in DOM order, so sorting here sorts the exported CSV, and the
// strongest emails are the ones that go into the campaign first.
//
// Sorted in place, before any card is built, so every index (`data-idx`, the
// "#N" label, the CSV lookup) refers to the same prospect. A row from an older
// run with no `personalization` sorts last rather than throwing.
//
// Worth knowing when you read the results: front-loading the best emails means
// reply rate starts high and drifts down for reasons that have nothing to do
// with fatigue or deliverability.
function sortByPersonalization() {
  const rank = (p) => (p.personalization && p.personalization.rank) || 99;
  (REVIEW.prospects || []).sort((a, b) => rank(a) - rank(b));
}

function render() {
  sortByPersonalization();
  document.getElementById("meta").textContent =
    "pack: " + (REVIEW.pack||"?") + "  ·  generated " + (REVIEW.generated_at||"?");
  document.getElementById("foot").textContent =
    "downloads: " + COLUMNS.join(", ");

  if (REVIEW.skipped && REVIEW.skipped.length) {
    const d = document.getElementById("skips");
    d.hidden = false;
    d.querySelector("summary").textContent = REVIEW.skipped.length + " prospect(s) skipped (no sequence) — show";
    const body = document.getElementById("skips-body");
    for (const s of REVIEW.skipped)
      body.append(el("tr", {}, el("td",{},text(s.firm||"?")), el("td",{},text(s.reason||"?"))));
  }

  const main = document.getElementById("rows");
  (REVIEW.prospects||[]).forEach((p,i) => main.append(card(p,i)));
  refreshCounts();
  autosizeAll();
}

// Text wraps to more lines when the window narrows (or on zoom / font load), so
// re-fit every box to its content on those events — otherwise a box sized at
// load stays too short and clips its copy behind an internal scroll.
window.addEventListener("resize", () => requestAnimationFrame(autosizeAll));
window.addEventListener("load", autosizeAll);

function csvCell(v) {
  v = v == null ? "" : String(v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function buildCsv() {
  const lines = [COLUMNS.join(",")];
  // `:not(.removed)` is what makes the X real: a removed prospect leaves the
  // downloaded CSV entirely, which is the only place removal has to hold.
  document.querySelectorAll(".card:not(.removed)").forEach(cardEl => {
    const idx = +cardEl.getAttribute("data-idx");
    const p = REVIEW.prospects[idx];
    const edited = {};
    cardEl.querySelectorAll(".f").forEach(f => { edited[f.getAttribute("data-key")] = f.value; });
    const row = {
      pack: REVIEW.pack, cohort_date: REVIEW.generated_at,
      email: p.email, first_name: p.first_name, last_name: p.last_name,
      company: p.company, linkedin_url: p.linkedin,
      subject: edited.subject, email_1: edited.email_1,
      email_2: edited.email_2, email_3: edited.email_3,
      li_dm_1: edited.li_dm_1, li_dm_1_evergreen: edited.li_dm_1_evergreen,
      li_dm_2: edited.li_dm_2,
    };
    lines.push(COLUMNS.map(c => csvCell(row[c])).join(","));
  });
  return lines.join("\r\n") + "\r\n";
}

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([buildCsv()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sequences.csv";
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});

render();
</script>
</body>
</html>
