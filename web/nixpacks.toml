# Railway has no native Vite/static preset, so this Nixpacks config builds the
# SPA and serves the static dist/ output on $PORT.
#
# VITE_API_BASE must be set as a Railway service variable so Vite inlines it at
# BUILD time (Vite bakes import.meta.env.VITE_* into the bundle during build).

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx -y serve -s dist -l $PORT"
